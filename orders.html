<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Orders | My Brand</title>

    <link rel="stylesheet"
          href="css/style.css">


    <style>

        /* ========================================= */
        /* HEADER WISHLIST ICON                      */
        /* ========================================= */

        .header-wishlist {
            width: 28px !important;
            height: 28px !important;

            display: flex !important;
            align-items: center !important;
            justify-content: center !important;

            color: #e00000 !important;

            text-decoration: none !important;

            font-size: 24px !important;
            line-height: 1 !important;

            padding: 0 !important;
            margin: 0 !important;

            cursor: pointer;

            transition: 0.3s ease;
        }


        .header-wishlist:hover {
            color: #b00000 !important;
            transform: scale(1.08);
        }

    </style>

</head>


<body>


<!-- =========================================
     HEADER
     ========================================= -->

<header>

    <a href="index.html" class="logo">
        My Brand
    </a>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="shop.html">
            Shop
        </a>

        <a href="about.html">
            About
        </a>

        <a href="contact.html">
            Contact
        </a>

    </nav>


    <div class="header-icons">


        <!-- CART -->

        <a href="cart.html"
           class="cart-icon"
           title="Shopping Bag">

            <img
                src="images/fashion-cart.png"
                alt="Shopping Bag">

        </a>


        <!-- WISHLIST -->

        <a href="wishlist.html"
           class="header-wishlist"
           title="Wishlist">

            ♥

        </a>


        <!-- PROFILE -->

        <button
            class="profile-icon"
            id="profile-button"
            type="button"
            aria-label="Profile">

            👤

        </button>


        <!-- PROFILE DROPDOWN -->

        <div
            class="profile-panel"
            id="profile-panel">


            <div class="profile-dropdown-header">

                <div class="profile-user">

                    <div class="profile-small-avatar">
                        👤
                    </div>

                    <div>

                        <strong>
                            My Account
                        </strong>

                        <small>
                            Welcome to My Brand
                        </small>

                    </div>

                </div>


                <button
                    class="profile-close"
                    id="profile-close"
                    type="button">

                    ×

                </button>

            </div>


            <!-- PROFILE -->

            <a
                href="profile.html"
                class="profile-menu">

                <span class="profile-menu-icon">
                    👤
                </span>

                <span class="profile-menu-text">

                    <strong>
                        Profile
                    </strong>

                    <small>
                        View your profile
                    </small>

                </span>

            </a>


            <!-- MY ORDERS -->

            <a
                href="orders.html"
                class="profile-menu">

                <span class="profile-menu-icon">
                    📦
                </span>

                <span class="profile-menu-text">

                    <strong>
                        My Orders
                    </strong>

                    <small>
                        View your orders
                    </small>

                </span>

            </a>


            <!-- SHOPPING BAG -->

            <a
                href="cart.html"
                class="profile-menu">

                <span class="profile-menu-icon">
                    🛍️
                </span>

                <span class="profile-menu-text">

                    <strong>
                        My Shopping Bag
                    </strong>

                    <small>
                        View items in your bag
                    </small>

                </span>

            </a>


            <!-- CONTACT -->

            <a
                href="contact.html"
                class="profile-menu">

                <span class="profile-menu-icon">
                    💬
                </span>

                <span class="profile-menu-text">

                    <strong>
                        Contact Us
                    </strong>

                    <small>
                        Get in touch with us
                    </small>

                </span>

            </a>


        </div>

    </div>

</header>



<!-- =========================================
     MY ORDERS
     ========================================= -->

<section class="orders-page">

    <div class="orders-container">


        <p class="small-title">
            MY ACCOUNT
        </p>


        <h1>
            My Orders
        </h1>


        <div class="orders-card">

            <!-- orders.js displays the orders here -->

        </div>


    </div>

</section>



<!-- =========================================
     FOOTER
     ========================================= -->

<footer>

    <p>
        © 2026 My Brand. All rights reserved.
    </p>

</footer>



<!-- =========================================
     PROFILE DROPDOWN
     ========================================= -->

<script>

    const profileButton =
        document.getElementById("profile-button");

    const profilePanel =
        document.getElementById("profile-panel");

    const profileClose =
        document.getElementById("profile-close");


    profileButton.addEventListener(
        "click",
        function (event) {

            event.stopPropagation();

            profilePanel.classList.toggle("active");

        }
    );


    profileClose.addEventListener(
        "click",
        function () {

            profilePanel.classList.remove("active");

        }
    );


    document.addEventListener(
        "click",
        function (event) {

            if (
                !profilePanel.contains(event.target) &&
                event.target !== profileButton
            ) {

                profilePanel.classList.remove("active");

            }

        }
    );

</script>



<!-- =========================================
     ORDERS JAVASCRIPT
     ========================================= -->

<script src="js/orders.js"></script>

<script src="js/cart-count.js"></script>
</body>

</html>
